services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ACREOPS_ENV: demo
      ACREOPS_DATA_DIR: /app/data
      ACREOPS_ARTIFACT_DIR: /app/artifacts
    volumes:
      - ./data:/app/data:ro
      - artifacts:/app/artifacts

  web:
    build:
      context: ./web
    ports:
      - "3000:3000"
    environment:
      ACREOPS_API_URL: http://api:8000
    depends_on:
      - api

volumes:
  artifacts:
