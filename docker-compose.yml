services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ACREOPS_ENV: demo
      ACREOPS_DATA_DIR: /app/data
      ACREOPS_ARTIFACT_DIR: /app/artifacts
    volumes:
      - ./data:/app/data:ro
      - artifacts:/app/artifacts

  ui:
    build: .
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      ACREOPS_API_URL: http://api:8000
    depends_on:
      - api

volumes:
  artifacts:
